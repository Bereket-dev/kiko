name: kiko
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.0
  drift_flutter: ^0.2.3
  sqlcipher_flutter_libs: ^0.5.4
  sqlite3: ^2.7.4

  # Storage / preferences
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.1

  # Native / platform
  pigeon: ^22.7.0
  local_auth: ^2.3.0

  # Crypto
  cryptography: ^2.7.0

  # Images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # URL launching (tel: intent)
  url_launcher: ^6.3.1
  csv: ^8.0.0
  excel: ^4.0.6
  file_picker: ^11.0.3
  share_plus: ^12.0.2
  cross_file: ^0.3.5+5

  # Firebase / Cloud
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.1.5
  workmanager: ^0.5.2

  # Crypto extras
  pointycastle: ^3.9.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

flutter_gen:
  output: lib/gen/
